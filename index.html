<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yoga H’om Studio Manager</title><style>
:root{--bg:#f7f3ec;--surface:#fff;--sage:#416244;--text:#2f3a32;--muted:#5b665e;--border:#e6dfd0;--amber:#f6e3c8;--green:#e3eedf;--red:#f6dad3}*{box-sizing:border-box}body{margin:0;background:#e9e9e3;color:var(--text);font:16px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;min-height:48px;border:1px solid var(--border);border-radius:12px;background:white;padding:10px 16px}button:hover{border-color:var(--sage)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b5603e;outline-offset:2px}button.primary{background:var(--sage);color:white;border-color:var(--sage)}button.link{border:0;background:transparent;color:#315b38;text-decoration:underline;padding:4px 0}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,serif;font-weight:500;line-height:1.2}h1{font-size:32px;letter-spacing:-.02em}h2{font-size:24px}h3{font-size:20px}p{margin-top:8px}small,.muted{color:var(--muted);font-size:16px}.app{max-width:1440px;margin:auto;min-height:100vh;background:var(--bg)}.top{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}.brand{font:24px Georgia,serif;white-space:nowrap}.brand i{color:var(--sage);font-style:normal;margin-right:8px}.role{display:flex;align-items:center;gap:10px}.role select{width:auto}.shell{display:flex;min-height:calc(100vh - 72px)}nav{width:232px;flex-shrink:0;padding:32px 16px;border-right:1px solid var(--border);background:#fbfaf7}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;margin-bottom:4px}nav button.active{background:#e3eedf;color:#24452b;font-weight:600}main{flex:1;padding:40px;min-width:0}.content{max-width:1000px;margin:auto}.phone{max-width:430px;margin:auto;background:var(--bg);min-height:720px;border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 8px 28px #283c2810}.eyebrow{text-transform:uppercase;letter-spacing:.09em;color:var(--sage);font-weight:600;font-size:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}.stack{display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid var(--border);border-radius:16px;padding:24px}.card h3+p{margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.row+.row{border-top:1px solid var(--border);padding-top:16px;margin-top:16px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:#ede6d8;color:#4c584e;font-size:16px;line-height:1.3}.success{background:var(--green);color:#1f3d23}.warn{background:var(--amber);color:#6b3f10}.error{background:var(--red);color:#6b2415}.notice{padding:16px;border-radius:12px;margin:16px 0}.number{font:32px Georgia,serif}.divider{border:0;border-top:1px solid var(--border);margin:24px 0}label{display:block;font-weight:600;margin:16px 0 6px}input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #aeb8ac;border-radius:12px;background:white}textarea{min-height:90px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:14px 12px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--muted);font-weight:600}.qr{width:180px;height:180px;margin:24px auto;background:repeating-conic-gradient(#203426 0 25%,#fff 0 50%) 0/20px 20px;border:12px solid white;outline:1px solid var(--border)}.center{text-align:center}.preview{position:fixed;bottom:16px;left:16px;z-index:20;max-width:280px}.preview details{background:#fff;border:1px solid #9ca99a;border-radius:12px;box-shadow:0 8px 24px #0002}.preview summary{padding:12px;cursor:pointer;font-weight:600}.preview .options{max-height:55vh;overflow:auto;padding:0 12px 12px;display:grid;gap:6px}.preview button{min-height:40px;text-align:left}.bar{height:18px;background:#e6eee3;border-radius:9px;overflow:hidden}.bar span{display:block;background:var(--sage);height:100%}.mobile-nav{display:none}.top select{min-height:48px}@media(max-width:800px){.top{padding:0 16px}.shell{display:block}nav{width:auto;border:0;border-bottom:1px solid var(--border);display:flex;overflow:auto;padding:8px;gap:4px}nav button{width:auto;white-space:nowrap;margin:0}main{padding:24px 16px}.phone{border:0;border-radius:0;padding:8px;min-height:0}.preview{bottom:8px;left:8px}.brand{font-size:20px}.role label{display:none}}
</style></head><body><div id="app"></div><div class="preview"><details><summary>Preview state</summary><div class="options" id="preview"></div></details></div><script>
const names=['Eleanor Whitfield','Marcus Reed','Sofia Alvarez','Ruth Miller','James Brooks','Linda Chen','David Wilson','Nora Patel','Helen Davis','Samuel Brown','Grace Taylor','Alice Morgan','Robert Lee','Clara Evans','Peter Young'];
const customers=names.map((name,i)=>({id:i,name,senior:i===0,phone:`(412) 555-${String(1100+i)}`,email:name.toLowerCase().replace(' ','.')+'@example.com',address:'Pittsburgh, PA'}));

const sessions=[{id:1,title:'Vinyasa Flow',day:'Tuesday',time:'6:00 PM',instructor:'Maya',type:'Regular class',capacity:20,date:'2026-11-10'}, {id:2,title:'Gentle Yoga',day:'Wednesday',time:'10:00 AM',instructor:'Maya',type:'Regular class',capacity:20,date:'2026-11-11'}, {id:3,title:'Prenatal Yoga',day:'Thursday',time:'5:30 PM',instructor:'Priya',type:'Special program',capacity:20,date:'2026-11-12',price:25},{id:4,title:'Weekend workshop',day:'Saturday',time:'11:00 AM',instructor:'Daniel',type:'Workshop',capacity:20,date:'2026-11-14',price:40},{id:5,title:'Gentle Yoga',day:'Last Wednesday',time:'10:00 AM',instructor:'Maya',type:'Regular class',capacity:20,date:'2026-11-04',past:true},{id:6,title:'Community Flow',day:'Friday',time:'9:00 AM',instructor:'Maya',type:'Regular class',capacity:20,date:'2026-11-13',full:true}];
let attendance=[{id:1,s:5,c:1,p:3,status:'present'},{id:2,s:5,c:2,p:4,status:'present'}], sales=[],audit=[], role='Customer',page='Check-in',sessionId=1,customerId=0,selectedPass=null,exception='',saleDraft={},search='',reportType='Compensation', reportEmpty=false, unverifiedMode='exclude';
const $=s=>document.querySelector(s), app=$('#app'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pending='<span class="badge">◷ Pending confirmation</span>'; const session=()=>sessions.find(x=>x.id===sessionId); const person=id=>customers.find(x=>x.id===id);const pass=id=>passes.find(x=>x.id===id);const records=id=>attendance.filter(a=>a.s===id&&a.status==='present');const count=s=>s.full?20:records(s.id).length;const left=s=>Math.max(0,s.capacity-count(s));const eligible=c=>passes.filter(p=>p.c===c&&(p.left===null||p.left>0)&&p.expiry>='2026-11-07').sort((a,b)=>a.expiry.localeCompare(b.expiry));const fmt=s=>`${s.day} · ${s.time}`;const badge=(text,cls='')=>`<span class="badge ${cls}">● ${text}</span>`;
const navs={Customer:['Check-in','Schedule','My passes'],Instructor:['My sessions','Live roster','Assisted lookup'],Manager:['Home','Record sale','Reports','Schedule','Customers']};
function btn(label,action,cls='',extra=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`}function shell(body){let phone=role==='Customer';app.innerHTML=`<div class="app"><header class="top"><div class="brand"><i>♧</i>Yoga H’om <span class="muted">Studio Manager</span></div><div class="role"><label for="role">View as</label><select id="role" aria-label="View as">${Object.keys(navs).map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('')}</select></div></header><div class="shell"><nav aria-label="${role} navigation">${navs[role].map(n=>btn(n,'nav',page===n?'active':'',`data-value="${n}"`)).join('')}</nav><main><div class="content ${phone?'phone':''}">${body}</div></main></div></div>`;}
function title(k,t,sub=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div></div>`}function sessionCard(s,action='choose'){return `<div class="card"><div class="row"><div><h3>${esc(s.title)}</h3><p class="muted">${fmt(s)} · ${s.instructor}</p><p>${left(s)} of ${s.capacity} seats left</p></div>${btn(action==='choose'?'Select':'Open',action,'',`data-id="${s.id}"`)}</div></div>`}function passCard(p){return `<div class="card"><div class="row"><div><h3>${esc(p.name)}</h3><p class="muted">Expires ${p.expiry}</p></div><div class="center"><div class="number">${p.left===null?'∞':p.left}</div><span class="muted">${p.left===null?'Unlimited':'classes left'}</span></div></div></div>`}
function render(){let html='';let s=session();if(role==='Customer'){
if(page==='Check-in')html=title('Welcome, Eleanor','Check in for class','Choose your session to get started.')+`<div class="stack">${sessions.filter(x=>!x.past).map(x=>sessionCard(x)).join('')}</div><p>${pending} Check-in window</p>`;
if(page==='Present') {let ps=eligible(0),p=pass(selectedPass)||ps[0];html=title('Check-in','Present your pass',`${s.title} · ${fmt(s)}`)+`<div class="card center"><div class="qr" aria-label="Illustrative QR code"></div><p>Pass selected: <strong>${p?esc(p.name):'No eligible pass'}</strong></p><p>${pending} Earliest expiry selected</p>${ps.length>1?btn('Change pass','changePass','link'):''}<div class="actions" style="justify-content:center">${btn('Simulate scan','scan','primary')}</div></div><div class="actions">${btn('Back','back')}</div>`}
if(page==='Change pass')html=title('Check-in','Choose a pass')+`<div class="stack">${eligible(0).map(p=>`<div class="card"><div class="row"><div><h3>${p.name}</h3><p>Expires ${p.expiry}</p></div>${btn('Use pass','usePass','',`data-id="${p.id}"`)}</div></div>`).join('')}</div>`;
if(page==='Result'){let a=attendance.find(x=>x.s===s.id&&x.c===0&&x.status==='present'),p=a&&pass(a.p);let messages={expired:['Pass expired','Please visit the front desk for help.'],empty:['No classes left','Ask your instructor for a hand.'],coverage:['Pass does not cover this offering','Please visit the front desk for help.'],full:['Class is full · 20 / 20','Ask your instructor for a hand.'],duplicate:['Already checked in','Your original check-in is confirmed.'],unreadable:['QR could not be read','Ask your instructor for help.']};let m=messages[exception];html=`<div class="notice ${m?'warn':'success'}">${m?'△':'✓'} ${m?m[0]:"You’re checked in"}</div><h1>${m?m[0]:"You’re checked in"}</h1><p>${m?m[1]:'We look forward to seeing you.'}</p><div class="card" style="margin-top:24px"><h3>${s.title}</h3><p>${fmt(s)} · ${s.instructor}</p>${(!m||exception==='duplicate')&&p?`<hr class="divider"><p>Pass used: ${p.name}</p><p>${p.left===null?'Unlimited · expires '+p.expiry:p.left+' classes left'}</p>`:''}</div><div class="actions">${btn('Back to check-in','home','primary')}</div>`}
if(page==='Schedule')html=title('Your studio','Upcoming sessions')+`<div class="stack">${sessions.filter(x=>!x.past).map(x=>sessionCard(x)).join('')}</div>`;
if(page==='My passes')html=title('Your account','My passes','Your active and purchased passes.')+`<div class="stack">${passes.filter(p=>p.c===0).map(passCard).join('')}</div>`;
}else if(role==='Instructor'){
if(page==='My sessions')html=title('Instructor · Maya','My sessions','Your upcoming and recent classes.')+`<div class="stack">${sessions.filter(x=>x.instructor==='Maya').map(x=>sessionCard(x,'roster')).join('')}</div>`;
if(page==='Live roster'||page==='Verify'||page==='Absent'){let rec=records(s.id);html=title('Instructor · Maya',page==='Live roster'?'Live roster':page==='Verify'?'Verify roster':'Mark absent',`${s.title} · ${fmt(s)}`);if(page==='Live roster'){html+=`${s.locked?`<div class="notice success">✓ Verified by Maya at ${s.locked}</div>`:s.past?`<div class="notice warn">△ Unverified roster</div>`:''}${left(s)===0?`<div class="notice warn">△ Class at capacity · 20 / 20 <br>${pending} ${btn('Request manager override','override')}</div>`:''}<div class="grid"><div class="card"><div class="number">${count(s)}</div>Checked in</div><div class="card"><div class="number">${left(s)}</div>Seats left of ${s.capacity}</div></div><div class="card" style="margin-top:16px"><h2>Checked in</h2>${rec.length?rec.map(a=>`<div class="row"><div><strong>${person(a.c).name}</strong><p class="muted">${pass(a.p)?.name||'Pass'}</p></div>${!s.locked?btn('Mark absent','absent','',`data-id="${a.id}"`):''}</div>`).join(''):'<p class="muted">No one has checked in yet.</p>'}</div><div class="actions">${!s.locked?btn('Verify and submit roster','verify','primary'):''}${btn('Assisted lookup','lookup')}</div><p>${pending} Roster lock and reopening</p>`}else if(page==='Verify')html+=`<div class="card"><h2>Confirm headcount</h2><p>${count(s)} attendees checked in. Submitting locks this roster.</p><p>${pending} Lock and reopening</p><div class="actions">${btn('Confirm and lock','lock','primary')}${btn('Back','rosterBack')}</div></div>`;else html+=`<div class="card"><p>Mark ${person(window.absentRecord.c).name} absent. Their class will be restored.</p><label for="reason">Reason required</label><textarea id="reason"></textarea><div id="error"></div><div class="actions">${btn('Confirm absence','saveAbsent','primary')}${btn('Back','rosterBack')}</div></div>`}
if(page==='Assisted lookup')html=title('Instructor · Maya','Find a customer','Search by name for a forgotten pass.')+`<label for="lookup">Customer name</label><input id="lookup" value="${esc(search)}" placeholder="Enter a name"><div class="stack" style="margin-top:16px">${search?customers.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())).map(c=>{let p=eligible(c.id)[0];return `<div class="card"><h3>${c.name}</h3><p class="muted">Customer •••${String(c.id+100).slice(-3)}</p><p>${p?'Eligible: '+p.name:'No eligible pass. Send customer to the front desk.'}</p>${p?`<div class="actions">${btn('Check in for customer','assist','primary',`data-id="${c.id}"`)}</div>`:''}</div>`}).join(''):'<p class="muted">Enter a name to find a customer.</p>'}</div>`;
}else{
if(page==='Home')html=title('Manager','Good day at the studio','Here is what needs your attention.')+`<div class="grid"><div class="card"><div class="eyebrow">Needs review</div><div class="number">${sessions.filter(x=>x.past&&!x.locked).length}</div><p>Unverified rosters</p><div class="actions">${btn('View sessions','managerSchedule')}</div></div><div class="card"><div class="eyebrow">Today’s work</div><h2>Keep records together</h2><p>Record a sale or review your studio reports.</p><div class="actions">${btn('Record a sale','saleStart','primary')}</div></div></div>`;
if(page==='Schedule')html=title('Manager','Schedule & offerings','Sessions, workshops and special programs.')+`<div class="actions" style="margin-bottom:20px">${btn('Add session','addSession','primary')}</div><div class="stack">${sessions.map(x=>`<div class="card"><div class="row"><div><h3>${x.title}</h3><p>${fmt(x)} · ${x.instructor}</p><p class="muted">${x.type} · Capacity ${x.capacity}${x.price?' · $'+x.price:''}</p>${x.past&&!x.locked?badge('Unverified','warn'):''}</div><span>${count(x)} / ${x.capacity}</span></div></div>`).join('')}</div><p>${pending} Ordinary pass coverage for workshops and special programs</p>`;
if(page==='Add session')html=title('Schedule','Add session')+`<div class="card"><label>Session name<input id="newTitle"></label><label>Offering<select id="newType"><option>Regular class</option><option>Workshop</option><option>Special program</option></select></label><label>Instructor<select id="newInstructor"><option>Maya</option><option>Daniel</option><option>Priya</option></select></label><label>Date<input type="date" id="newDate"></label><label>Time<input type="time" id="newTime"></label><label>Capacity<input type="number" id="newCapacity" value="20" min="1"></label><label>Price for special offerings<input type="number" id="newPrice" min="0" value="0"></label><div class="actions">${btn('Add session','saveSession','primary')}${btn('Cancel','managerSchedule')}</div><div id="error"></div></div>`;
if(page==='Customers')html=title('Manager','Customers','Shared records for your community.')+`<label for="customerSearch">Search customers</label><input id="customerSearch" value="${esc(search)}" placeholder="Search by name"><div class="stack" style="margin-top:16px">${customers.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())).map(c=>`<div class="card"><div class="row"><div><h3>${c.name}</h3><p class="muted">${c.email}</p></div>${btn('View details','customerDetail','',`data-id="${c.id}"`)}</div></div>`).join('')}</div><p>${pending} Required fields and duplicate handling</p>`;
if(page==='Customer detail'){let c=person(customerId);html=title('Customers',c.name)+`<div class="grid"><div class="card"><h2>Contact</h2><p>${c.phone}<br>${c.email}<br>${c.address}</p></div><div class="card"><h2>Passes</h2>${passes.filter(p=>p.c===c.id).map(p=>`<p>${p.name} · ${p.left===null?'Unlimited':p.left+' left'} · expires ${p.expiry}</p>`).join('')||'<p>No passes yet.</p>'}</div></div><div class="card" style="margin-top:16px"><h2>Attendance history</h2>${attendance.filter(a=>a.c===c.id).map(a=>`<p>${sessions.find(x=>x.id===a.s)?.title} · ${a.status}</p>`).join('')||'<p>No attendance yet.</p>'}</div><div class="card" style="margin-top:16px"><h2>Audit trail</h2>${audit.filter(a=>a.c===c.id).map(a=>`<p>${a.who} · ${a.when}<br>${a.before} → ${a.after} · ${esc(a.reason)}</p>`).join('')||'<p>No changes recorded.</p>'}</div><div class="actions">${btn('Back to customers','customers')}</div>`}
if(page==='Record sale'){let c=person(+saleDraft.c||0);html=title('Manager','Record a package sale','Choose a customer and product.')+`<div class="card"><label>Customer<select id="saleCustomer">${customers.map(c=>`<option value="${c.id}" ${c.id===(+saleDraft.c||0)?'selected':''}>${c.name}</option>`).join('')}</select></label><p>Active passes: ${passes.filter(p=>p.c===c.id).map(p=>p.name).join(', ')||'None'}</p><label>Product<select id="product"><option>4-class</option><option>10-class</option><option>Unlimited</option><option>Drop-in</option><option>Senior price</option></select></label><label><input type="checkbox" id="senior" style="width:20px;min-height:20px"> Senior eligibility confirmed ${pending}</label><p>${pending} Validity and activation</p><p>${pending} Ordinary pass coverage</p><div class="actions">${btn('Review sale','reviewSale','primary')}${btn('Cancel','cancelSale')}</div><div id="error"></div></div>`}
if(page==='Review sale'){let d=saleDraft;html=title('Record sale','Review sale')+`<div class="card"><h2>${person(+d.c).name}</h2><p>${d.product} · $${d.price}</p><p>${d.count===null?'Unlimited':d.count+' class'+(d.count===1?'':'es')} · valid for 90 days from purchase ${pending}</p><p>Eligible offerings: regular classes ${pending}</p><label>Payment method<select id="payment"><option>Cash</option><option>Check</option><option>External card terminal</option></select></label><label>Payment status<select id="paymentStatus"><option>Paid</option><option>Unpaid</option></select></label><p>${pending} Unpaid pass usability</p><div class="actions">${btn('Confirm sale','confirmSale','primary')}${btn('Cancel','cancelSale')}</div></div>`}
if(page==='Sale result')html=title('Sale recorded','Your sale is saved')+`<div class="notice success">✓ Sale ${saleDraft.id} recorded</div><p>The pass is available in the customer’s account.</p><div class="actions">${btn('Record another sale','saleStart','primary')}</div>`;
if(page==='Sale failure')html=title('Sale status','We couldn’t confirm this sale')+`<div class="notice warn">△ We couldn’t confirm this sale. Check before retrying.</div><p>No sale was recorded in this preview.</p><div class="actions">${btn('Retry safely','confirmSale','primary')}${btn('Cancel','cancelSale')}</div>`;
if(page==='Reports'){let filtered=sessions.filter(x=>!x.past||unverifiedMode!=='exclude'||x.locked), total=filtered.reduce((n,x)=>n+count(x),0);html=title('Manager','Reports','Explore verified attendance and studio activity.')+`<div class="card"><div class="grid"><label>Date range<select id="dateFilter"><option value="all">All sample dates</option><option value="empty" ${reportEmpty?'selected':''}>No activity period</option></select></label><label>Program<select id="programFilter"><option>All programs</option><option>Regular class</option><option>Workshop</option><option>Special program</option></select></label><label>Instructor<select id="instructorFilter"><option>All instructors</option><option>Maya</option><option>Daniel</option><option>Priya</option></select></label></div><div class="actions">${['Compensation','Utilization','Sales'].map(x=>btn(x,'reportTab',reportType===x?'primary':'',`data-value="${x}"`)).join('')}</div></div><div class="card" style="margin-top:16px">${reportEmpty?'<h2>No activity in this range</h2><p>Try a different date range or filter.</p>':reportType==='Compensation'?`<h2>Instructor compensation</h2><p class="muted">Example rates: $25 base + $2 per verified attendee. Example: 10 sessions and 150 attendees = $550.</p><p>Unverified sessions: <select id="unverified" style="width:auto"><option value="exclude">Exclude</option><option value="lock" ${unverifiedMode==='lock'?'selected':''}>Flag for review</option></select></p><div class="tablewrap"><table><tr><th>Session</th><th>Instructor</th><th>Verified attendees</th><th>Base + attendee rate</th><th>Total</th></tr>${sessions.map(x=>`<tr><td>${x.title}<br>${x.date} ${!x.locked?badge('Unverified','warn'):badge('Verified','success')}</td><td>${x.instructor}</td><td>${x.locked?count(x):'—'}</td><td>$25 + $2 / attendee</td><td>${x.locked?'$'+(25+2*count(x)):'Excluded'}</td></tr>`).join('')}</table></div>`:reportType==='Utilization'?`<h2>Capacity utilization</h2><p>Attendees divided by capacity · period average ${filtered.length?Math.round(total/filtered.reduce((n,x)=>n+x.capacity,0)*100):0}%</p>${filtered.map(x=>`<div style="margin-top:16px"><div class="row"><span>${x.title} · ${x.date} ${!x.locked?badge('Unverified','warn'):''}</span><span>${count(x)} / ${x.capacity}</span></div><div class="bar"><span style="width:${count(x)/x.capacity*100}%"></span></div></div>`).join('')}`:`<h2>Sales and revenue by product</h2>${sales.length?sales.map(x=>`<div class="row"><span>${x.product}</span><strong>$${x.price}</strong></div>`).join(''):'<p>No sales recorded yet. Record a sale to see it here.</p>'}`}</div><div class="actions">${btn('Export CSV','csv')}${btn('Export PDF','pdf')}</div>`}
}
shell(html);}
function checkin(c,override=''){let s=session();let existing=attendance.find(a=>a.s===s.id&&a.c===c&&a.status==='present');if(existing)return 'duplicate';if(override)return override;if(left(s)<=0)return 'full';let p=c===0&&selectedPass?pass(selectedPass):eligible(c)[0];if(!p)return 'empty';if(s.type!=='Regular class')return 'coverage';attendance.push({id:Date.now(),s:s.id,c,p:p.id,status:'present'});if(p.left!==null)p.left--;return ''}
const exceptions=[['Expired pass','expired'],['No classes left','empty'],['Pass does not cover offering','coverage'],['Class full','full'],['Already checked in','duplicate'],['Unreadable QR','unreadable'],['Sale save failure','failure'],['Unverified roster','unverified'],['Active pass on sale','active'],['Senior eligibility','senior'],['Unpaid sale','unpaid'],['Empty report','emptyReport']];$('#preview').innerHTML=exceptions.map(([name,value])=>btn(name,'preview','',`data-value="${value}"`)).join('');
document.addEventListener('change',e=>{let id=e.target.id;if(id==='role'){role=e.target.value;page=navs[role][0];search='';exception='';render()}if(id==='saleCustomer'){saleDraft.c=e.target.value;render()}if(id==='dateFilter'){reportEmpty=e.target.value==='empty';render()}if(id==='unverified'){unverifiedMode=e.target.value;render()}if(id==='programFilter'||id==='instructorFilter'){let p=$('#programFilter')?.value,i=$('#instructorFilter')?.value;document.querySelectorAll('table tr').forEach((row,n)=>{if(n)row.hidden=(i!=='All instructors'&&!row.textContent.includes(i))||(p!=='All programs'&&!sessions[n-1]?.type.includes(p))})}});
document.addEventListener('input',e=>{if(e.target.id==='lookup'||e.target.id==='customerSearch'){let id=e.target.id,pos=e.target.selectionStart;search=e.target.value;render();let el=document.getElementById(id);el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value,id=+b.dataset.id;
switch(a){case'nav':page=v;search='';break;case'choose':sessionId=id;selectedPass=null;exception='';page='Present';break;case'back':page='Check-in';break;case'home':page='Check-in';exception='';break;case'changePass':page='Change pass';break;case'usePass':selectedPass=id;page='Present';break;case'scan':exception=checkin(0,exception);page='Result';break;case'roster':sessionId=id;page='Live roster';break;case'rosterBack':page='Live roster';break;case'lookup':page='Assisted lookup';search='';break;case'assist':{let result=checkin(id);alert(result==='duplicate'?'Already checked in.':result==='full'?'Class is full. Request a manager override.':result?'No eligible pass. Send customer to the front desk.':'Customer checked in.');page='Live roster';break}case'absent':window.absentRecord=attendance.find(x=>x.id===id);page='Absent';break;case'saveAbsent':{let reason=$('#reason').value.trim();if(!reason){$('#error').innerHTML='<p class="notice error">Please enter a reason.</p>';return}let r=window.absentRecord;r.status='absent';let p=pass(r.p);if(p&&p.left!==null)p.left++;audit.push({c:r.c,who:'Maya',when:new Date().toLocaleString(),before:'Present',after:'Absent',reason});page='Live roster';break}case'verify':page='Verify';break;case'lock':session().locked=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});page='Live roster';break;case'override':alert('Manager override requested. Pending confirmation.');return;case'managerSchedule':page='Schedule';break;case'addSession':page='Add session';break;case'saveSession':{let t=$('#newTitle').value.trim(),date=$('#newDate').value,time=$('#newTime').value;if(!t||!date||!time){$('#error').innerHTML='<p class="notice error">Enter a session name, date and time.</p>';return}sessions.push({id:Date.now(),title:t,day:date,time,instructor:$('#newInstructor').value,type:$('#newType').value,capacity:+$('#newCapacity').value||20,price:+$('#newPrice').value,date});page='Schedule';break}case'customers':page='Customers';search='';break;case'customerDetail':customerId=id;page='Customer detail';break;case'saleStart':saleDraft={c:0};page='Record sale';break;case'cancelSale':saleDraft={};page='Home';break;case'reviewSale':{let product=$('#product').value;if(product==='Senior price'&&!$('#senior').checked){$('#error').innerHTML='<p class="notice error">Confirm senior eligibility before continuing.</p>';return}let products={'4-class':[60,4],'10-class':[135,10],'Unlimited':[120,null],'Drop-in':[18,1],'Senior price':[45,4]};saleDraft={c:$('#saleCustomer').value,product,price:products[product][0],count:products[product][1]};page='Review sale';break}case'confirmSale':{if(saleDraft.saved){page='Sale result';break}if(saleDraft.fail){saleDraft.fail=false;page='Sale failure';break}saleDraft.payment=$('#payment')?.value||'Cash';saleDraft.status=$('#paymentStatus')?.value||'Paid';saleDraft.id='SALE-'+String(sales.length+1001);saleDraft.saved=true;sales.push({...saleDraft});passes.push({id:Date.now(),c:+saleDraft.c,name:saleDraft.product+' pass',left:saleDraft.count,kind:saleDraft.count===null?'unlimited':'count',expiry:'2027-02-05'});page='Sale result';break}case'reportTab':reportType=v;break;case'csv':{let csv='Session,Instructor,Date,Attendees,Verified\n'+sessions.map(x=>`"${x.title}",${x.instructor},${x.date},${count(x)},${!!x.locked}`).join('\n');let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download='studio-report.csv';link.click();URL.revokeObjectURL(link.href);return}case'pdf':window.print();return;case'preview':{if(['expired','empty','coverage','full','unreadable'].includes(v)){role='Customer';sessionId=v==='full'?6:1;exception=v;page='Result'}else if(v==='duplicate'){role='Customer';sessionId=1;if(!attendance.find(x=>x.s===1&&x.c===0&&x.status==='present'))checkin(0);exception='duplicate';page='Result'}else if(v==='failure'){role='Manager';saleDraft={c:0,product:'4-class',price:60,count:4,fail:true};page='Review sale'}else if(v==='unverified'){role='Instructor';sessionId=5;page='Live roster'}else if(v==='emptyReport'){role='Manager';page='Reports';reportEmpty=true}else{role='Manager';saleDraft={c:0};page='Record sale'}break}default:return}render()});render();
</script></body></html>
